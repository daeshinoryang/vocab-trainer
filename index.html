<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영어 II Vocabulary Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100/70 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <button class="header-nav-btn flex items-center gap-2.5 text-left group" data-route="home">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="text-sm sm:text-base font-black text-slate-900 tracking-tight block leading-tight">영어 II Vocab Trainer</span>
          <span class="text-[10px] text-slate-400 font-semibold block leading-tight">대전대신고등학교 2학년 (77단어)</span>
        </div>
      </button>

      <nav class="flex items-center gap-1 sm:gap-2">
        <button class="header-nav-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all flex items-center gap-1.5" data-route="home">
          <i data-lucide="home" class="w-4 h-4"></i>
          <span class="hidden sm:inline">홈</span>
        </button>

        <button class="header-nav-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all flex items-center gap-1.5" data-route="study">
          <i data-lucide="book-open" class="w-4 h-4"></i>
          <span class="hidden sm:inline">단어 학습</span>
        </button>

        <button class="header-nav-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all flex items-center gap-1.5" data-route="test">
          <i data-lucide="edit-3" class="w-4 h-4"></i>
          <span class="hidden sm:inline">단어 테스트</span>
        </button>

        <button class="header-nav-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all flex items-center gap-1.5 relative" data-route="wrong-notes">
          <i data-lucide="file-x-2" class="w-4 h-4 text-rose-500"></i>
          <span class="hidden sm:inline">오답노트</span>
          <span id="header-wrong-badge" class="hidden px-1.5 py-0.2 text-[10px] font-black bg-rose-500 text-white rounded-full">0</span>
        </button>

        <button class="header-nav-btn px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all flex items-center gap-1.5" data-route="stats">
          <i data-lucide="pie-chart" class="w-4 h-4"></i>
          <span class="hidden sm:inline">학습 통계</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8" id="app-main-content">
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    <div class="max-w-6xl mx-auto px-4 space-y-1">
      <p class="font-bold text-slate-600">영어 II Vocabulary Trainer</p>
      <p>대전대신고등학교 2학년 영단어장 기반 · 영영풀이 / 예문빈칸 / 영한 / 한영 완벽 지원</p>
      <p class="pt-1 text-slate-400">Made by <span class="font-semibold text-slate-500">김민준</span> · <a href="mailto:25_kmj0504@dshs.kr" class="hover:text-indigo-500 transition-colors">25_kmj0504@dshs.kr</a></p>
    </div>
  </footer>

  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4">
    <div id="modal-content" class="w-full flex items-center justify-center"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
